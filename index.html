<style>html,body{margin:0;height:auto}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout: a command-console shell — badge-crowned header, stat strip, then the working panel (form / list / review queue). Single dark look taken from the unit's gunmetal-and-navy badge. */
:root{
  color-scheme:dark;
  --ink:#070c17;          /* page ground, near-black navy */
  --panel:#0f1828;        /* raised surfaces */
  --panel-2:#16223a;
  --line:#26344f;
  --navy:#1e3d82;         /* badge enamel blue */
  --navy-hi:#3463c9;
  --steel:#c5ccd6;        /* badge pewter */
  --steel-dim:#8792a5;
  --fg:#e8ecf2;
  --ok:#3fb97a; --warn:#e2a93b; --bad:#e2574c;
  --f-display:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:12px;
}
*{box-sizing:border-box}
html{background:var(--ink)}
body{background:var(--ink);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.65;direction:rtl;min-height:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px;overflow-x:hidden}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;
  background:radial-gradient(900px 500px at 50% -10%,rgba(52,99,201,.22),transparent 70%),
  repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 4px)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--navy-hi);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}

/* ---------- login ---------- */
.gate{min-height:100vh;display:grid;place-items:center;padding-block:32px}
.gate-card{width:100%;max-width:440px;display:grid;gap:22px;justify-items:center;text-align:center}
.emblem{position:relative;width:min(210px,56vw);aspect-ratio:1;max-width:100%}
.emblem img{position:relative;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 12px 30px rgba(0,0,0,.6));animation:emblemIn 1.1s cubic-bezier(.2,.8,.2,1) both}
.emblem::before{content:"";position:absolute;inset:-14px;border-radius:50%;
  background:conic-gradient(from 0deg,transparent 0 75%,rgba(52,99,201,.55) 92%,rgba(197,204,214,.9) 100%);
  -webkit-mask:radial-gradient(circle,transparent 62%,#000 63%,#000 66%,transparent 67%);mask:radial-gradient(circle,transparent 62%,#000 63%,#000 66%,transparent 67%);
  animation:sweep 3.2s linear infinite}
.emblem::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:1px solid rgba(197,204,214,.12)}
@keyframes sweep{to{transform:rotate(360deg)}}
@keyframes emblemIn{from{transform:scale(.6) rotate(-25deg);opacity:0}to{transform:none;opacity:1}}
.gate h1{font-size:clamp(28px,7vw,38px);letter-spacing:.5px;background:linear-gradient(180deg,#fff,var(--steel) 60%,var(--steel-dim));-webkit-background-clip:text;background-clip:text;color:transparent}
.gate .sub{color:var(--steel-dim);font-size:14px;margin-top:-14px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px;width:100%}
.seg button{border:0;background:transparent;padding:9px;border-radius:999px;cursor:pointer;color:var(--steel-dim);font-weight:600;transition:.25s}
.seg button.on{background:var(--navy);color:#fff;box-shadow:0 4px 16px rgba(30,61,130,.5)}
.form{display:grid;gap:14px;width:100%;text-align:right}
.field{display:grid;gap:6px;min-width:0}
.field>span{font-size:13px;color:var(--steel);font-weight:600}
.field small{color:var(--steel-dim);font-size:12px}
input,select,textarea{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 13px;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--navy-hi);box-shadow:0 0 0 3px rgba(52,99,201,.25)}
textarea{min-height:130px;resize:vertical;line-height:1.8}
.code-row{display:grid;grid-template-columns:1fr 110px;gap:10px}
.preview-code{font-family:var(--f-mono);font-size:13px;color:var(--steel);background:rgba(30,61,130,.18);border:1px dashed rgba(52,99,201,.5);border-radius:10px;padding:9px 12px;text-align:center;direction:rtl}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:10px;padding:11px 18px;font-weight:700;cursor:pointer;position:relative;overflow:hidden;transition:transform .15s,background .2s,border-color .2s}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(180deg,var(--navy-hi),var(--navy));color:#fff;box-shadow:0 6px 20px rgba(30,61,130,.45)}
.btn-primary::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.28) 50%,transparent 70%);transform:translateX(120%);transition:transform .7s}
.btn-primary:hover::after{transform:translateX(-120%)}
.btn-ghost{background:var(--panel);border-color:var(--line);color:var(--steel)}
.btn-ghost:hover{border-color:var(--steel-dim)}
.btn-ok{background:var(--ok);color:#06150d}
.btn-bad{background:var(--bad);color:#fff}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn-sm{padding:7px 12px;font-size:13px;border-radius:8px}
.err{color:var(--bad);font-size:13px;min-height:1em}

/* ---------- shell ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));
  background:rgba(7,12,23,.82);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--ink)}
.top .wrap{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-inline-end:auto;min-width:0}
.brand img{width:44px;height:44px;object-fit:contain}
.brand b{font-family:var(--f-display);font-size:19px;display:block;line-height:1.2}
.brand small{color:var(--steel-dim);font-size:12px}
.who{display:flex;align-items:center;gap:10px;font-size:13px}
.who .tag{background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:5px 12px;white-space:nowrap}
.nav{display:flex;gap:6px;overflow-x:auto;padding-block:12px 4px;scrollbar-width:none}
.nav button{flex:none;border:1px solid var(--line);background:var(--panel);color:var(--steel-dim);border-radius:999px;padding:8px 16px;cursor:pointer;font-weight:600;transition:.2s;display:flex;gap:6px;align-items:center}
.nav button.on{background:var(--steel);color:var(--ink);border-color:var(--steel)}
.nav .count{background:var(--bad);color:#fff;border-radius:999px;font-size:11px;padding:0 7px;line-height:18px}

main{padding-top:22px;display:grid;gap:22px}
.view{display:grid;gap:22px;animation:rise .45s ease both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.section-h{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.section-h h2{font-size:22px}
.section-h p{margin:2px 0 0;color:var(--steel-dim);font-size:13px}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;position:relative;overflow:hidden;animation:rise .5s ease both}
.stat:nth-child(2){animation-delay:.06s}.stat:nth-child(3){animation-delay:.12s}.stat:nth-child(4){animation-delay:.18s}
.stat::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--c,var(--steel))}
.stat span{color:var(--steel-dim);font-size:13px}
.stat b{display:block;font-family:var(--f-mono);font-size:34px;line-height:1.1;margin-top:6px;color:var(--c,var(--fg))}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}}

/* report list */
.list{display:grid;gap:10px}
.rep{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;cursor:pointer;transition:border-color .2s,transform .2s;animation:rise .4s ease both}
.rep:hover{border-color:var(--steel-dim);transform:translateY(-2px)}
.rep .no{width:52px;height:52px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--f-mono);font-size:18px;color:var(--steel)}
.rep .meta{min-width:0}
.rep .meta b{display:block;font-size:15px}
.rep .meta small{color:var(--steel-dim);font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rep .note{grid-column:1/-1;background:rgba(226,87,76,.1);border:1px solid rgba(226,87,76,.35);color:#f3b2ab;border-radius:8px;padding:8px 12px;font-size:13px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 11px;font-size:12px;font-weight:700;white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.pending{color:var(--warn);background:rgba(226,169,59,.12)}
.chip.pending::before{animation:blink 1.4s infinite}
.chip.accepted{color:var(--ok);background:rgba(63,185,122,.12)}
.chip.rejected{color:var(--bad);background:rgba(226,87,76,.12)}
@keyframes blink{50%{opacity:.25}}
.empty{text-align:center;padding:40px 16px;border:1px dashed var(--line);border-radius:var(--r);color:var(--steel-dim)}
.empty b{display:block;color:var(--steel);font-family:var(--f-display);font-size:18px;margin-bottom:4px}

/* new report */
.composer{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:860px){.composer{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:16px;min-width:0}
.card h3{font-size:16px;display:flex;align-items:center;gap:10px}
.card h3 .step{font-family:var(--f-mono);font-size:12px;color:var(--ink);background:var(--steel);border-radius:6px;padding:1px 7px}
.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.type{position:relative;text-align:right;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;transition:.2s;display:grid;gap:4px}
.type b{font-size:14px}
.type small{color:var(--steel-dim);font-size:12px;line-height:1.5}
.type:hover{border-color:var(--steel-dim)}
.type.on{border-color:var(--navy-hi);background:linear-gradient(160deg,rgba(52,99,201,.28),rgba(30,61,130,.1));box-shadow:0 0 0 1px var(--navy-hi) inset}
.type.on::after{content:"✓";position:absolute;top:8px;left:10px;width:20px;height:20px;border-radius:50%;background:var(--navy-hi);color:#fff;font-size:12px;display:grid;place-items:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.two{grid-template-columns:1fr}}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--panel-2);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;transition:.2s;color:var(--steel)}
.pill.on{background:var(--navy);border-color:var(--navy-hi);color:#fff}
.cases{display:grid;gap:8px}
.case-row{display:grid;grid-template-columns:28px 1fr 32px;gap:8px;align-items:center}
.case-row .n{font-family:var(--f-mono);color:var(--steel-dim);text-align:center}
.x{border:1px solid var(--line);background:transparent;border-radius:8px;height:36px;cursor:pointer;color:var(--steel-dim)}
.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:20px;text-align:center;cursor:pointer;transition:.2s;color:var(--steel-dim);display:grid;gap:4px;justify-items:center}
.drop:hover,.drop.over{border-color:var(--navy-hi);background:rgba(52,99,201,.08);color:var(--steel)}
.drop svg{width:34px;height:34px;color:var(--steel)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.thumb{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--panel-2);max-width:100%;animation:rise .3s ease both}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.thumb button{position:absolute;top:5px;left:5px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.7);color:#fff;cursor:pointer;font-size:14px;line-height:1}
.paper{background:#0b1322;border:1px solid var(--line);border-radius:var(--r);padding:18px;white-space:pre-wrap;font-size:13.5px;line-height:1.9;color:var(--steel);max-height:520px;overflow:auto;position:relative}
.paper .hd{color:#fff;font-weight:700}
.sticky-col{position:sticky;top:calc(env(safe-area-inset-top,0px) + 130px);display:grid;gap:12px}
@media (max-width:860px){.sticky-col{position:static}}
.req{color:var(--warn);font-size:12px}

/* review */
.filters{display:flex;gap:6px;flex-wrap:wrap}
.toolbar{display:grid;grid-template-columns:minmax(0,2fr) repeat(3,minmax(0,1fr));gap:10px;align-items:end}
@media (max-width:760px){.toolbar{grid-template-columns:1fr 1fr}.toolbar .grow{grid-column:1/-1}}
.toolbar .field>span{font-size:12px}
.search{position:relative}
.search svg{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--steel-dim);pointer-events:none}
.search input{padding-right:36px}
input[type=date]{direction:ltr;text-align:right}
.result-line{color:var(--steel-dim);font-size:13px}
.range{display:flex;gap:10px;align-items:end;flex-wrap:wrap}
.range .field{width:170px;max-width:100%}
.check{display:inline-flex;gap:8px;align-items:center;color:var(--steel);font-size:13.5px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--navy-hi)}
th.sort{cursor:pointer;user-select:none}
th.sort.on{color:var(--fg)}
tfoot td{background:var(--panel-2);font-weight:700}
.rate{font-family:var(--f-mono);font-size:12.5px}
.lvl{display:inline-flex;border-radius:6px;padding:2px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.lvl.note{background:rgba(197,204,214,.12);color:var(--steel)}
.lvl.warn{background:rgba(226,169,59,.14);color:var(--warn)}
.lvl.final{background:rgba(226,87,76,.14);color:var(--bad)}
.lvl.fire{background:var(--bad);color:#fff}
.viol{display:grid;grid-template-columns:1fr auto;gap:6px 14px;background:var(--panel);border:1px solid var(--line);border-inline-start:3px solid var(--c,var(--line));border-radius:var(--r);padding:12px 16px;animation:rise .35s ease both}
.viol p{margin:0;grid-column:1/-1;color:var(--steel);font-size:14px;overflow-wrap:anywhere}
.viol small{color:var(--steel-dim);font-size:12.5px}
.flag{font-size:11.5px;color:var(--bad);font-weight:700}
.vform{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:12px}
@media (max-width:620px){.vform{grid-template-columns:1fr}}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:760px}
.toggle{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;transition:border-color .2s}
.toggle:hover{border-color:var(--steel-dim)}
.toggle b{display:block;font-size:14px}.toggle small{color:var(--steel-dim);font-size:12.5px}
.sw{position:relative;width:46px;height:26px}
.sw input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.sw i{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:.25s;pointer-events:none}
.sw i::after{content:"";position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:var(--steel);transition:.25s}
.sw input:checked+i{background:var(--navy-hi)}
.sw input:checked+i::after{right:23px;background:#fff}
.sw input:focus-visible+i{outline:2px solid var(--navy-hi);outline-offset:2px}
th,td{padding:11px 14px;text-align:right;border-bottom:1px solid var(--line)}
th{background:var(--panel-2);color:var(--steel-dim);font-weight:600;font-size:12.5px}
td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.bar{height:6px;border-radius:3px;background:var(--panel-2);overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--navy),var(--navy-hi))}

/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(3,6,12,.75);backdrop-filter:blur(6px);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:fade .2s ease}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:760px;max-height:100%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;display:grid;gap:16px;animation:pop .3s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{transform:scale(.94) translateY(10px);opacity:0}}
.sheet-h{display:flex;gap:12px;align-items:start;justify-content:space-between}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kv div{background:var(--panel-2);border-radius:10px;padding:10px 12px}
.kv small{display:block;color:var(--steel-dim);font-size:12px}
.kv b{font-size:14px;overflow-wrap:anywhere}
.decide{display:grid;gap:10px;border-top:1px solid var(--line);padding-top:16px}
.decide .row{display:flex;gap:10px;flex-wrap:wrap}
.lightbox{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.92);display:grid;place-items:center;cursor:zoom-out;animation:fade .2s}
.lightbox img{max-width:94vw;max-height:90vh;border-radius:8px}

.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:70;background:var(--steel);color:var(--ink);font-weight:700;padding:11px 20px;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:toast .35s cubic-bezier(.2,.9,.3,1.3)}
@keyframes toast{from{transform:translate(-50%,30px);opacity:0}}
.banner{background:rgba(226,169,59,.1);border:1px solid rgba(226,169,59,.4);color:#f1d08f;border-radius:10px;padding:10px 14px;font-size:13.5px}
.loader{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sweep .7s linear infinite}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.issue-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:860px){.issue-grid{grid-template-columns:1fr}}

details summary{font-weight:600}
</style>

const STATUS = {pending:"بانتظار المراجعة",accepted:"مقبول",rejected:"مرفوض"};
const PERMS = [
  {id:"review", name:"مراجعة التقارير", hint:"قبول ورفض تقارير الأفراد وكتابة الملاحظات"},

];
const LEVELS={note:{name:"ملاحظة",c:"var(--steel-dim)"},warn:{name:"إنذار",c:"var(--warn)"},final:{name:"إنذار نهائي",c:"var(--bad)"},fire:{name:"إعفاء من الفرقة",c:"var(--bad)"}};

/* ---------- state ---------- */
const S = {
  sb:null, uid:null, ready:false, loadErr:"", authBusy:false,
  members:{}, reports:[], violations:[], me:null,
  view:"home", gateTab:"login", filter:"pending",
  rf:{q:"",type:"",from:"",to:""}, inv:null, invSort:"a", invHideEmpty:false, vf:"", vlvl:"warn",
  draft:null, channel:null, invites:[], issued:null, iperms:{review:false,manage:false},
};
const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(msg){document.querySelectorAll(".toast").forEach(t=>t.remove());const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2800)}
const ms = v => v? new Date(v).getTime() : 0;
const fmtDate = ts => ts? new Date(ts).toLocaleString("ar",{dateStyle:"medium",timeStyle:"short"}) : "";
const hasPerm = (m,p) => !!m && m.status==="active" && !!(m.perms && m.perms[p]===true);
const isReviewer = m => hasPerm(m,"review");
const canManage = m => hasPerm(m,"manage");
const myReports = () => S.me? S.reports.filter(r=>r.ownerKey===S.me.key):[];
const activeMembers = () => Object.values(S.members).filter(m=>m.status==="active").sort((a,b)=>a.name.localeCompare(b.name,"ar"));
const authEmail = key => `${key}@${EMAIL_DOMAIN}`;
const authPass = (pin,key) => `${pin}#rasd#${key}`;

/* ---------- row mapping ---------- */
const mapMember = r => ({key:r.id,codeKey:r.code_key,name:r.name,codeType:r.code_type,num:r.num,status:r.status,perms:r.perms||{},
  permBy:r.perm_by,permAt:ms(r.perm_at),approvedBy:r.approved_by,createdAt:ms(r.created_at)});
const mapReport = r => ({id:r.id,num:r.num,type:r.type,shift:r.shift,area:r.area,leader:r.leader,leaderName:r.leader_name,details:r.details,
  cases:r.cases||[],participants:r.participants||[],images:r.images||[],imageCount:(r.images||[]).length,ownerKey:r.owner,ownerName:r.owner_name,
  ownerCode:r.owner_code,status:r.status,note:r.note||"",reviewer:r.reviewer,reviewedAt:ms(r.reviewed_at),createdAt:ms(r.created_at)});
const mapViol = r => ({id:r.id,memberKey:r.member_id,memberName:r.member_name,memberCode:r.member_code,level:r.level,reason:r.reason,by:r.by_label,createdAt:ms(r.created_at)});

/* ---------- data ---------- */
async function fetchMembers(){const {data,error}=await S.sb.from("members").select("*");if(error)throw error;const m={};data.forEach(r=>m[r.id]=mapMember(r));S.members=m;S.me=S.uid?m[S.uid]||null:null}
async function fetchReports(){const {data,error}=await S.sb.from("reports").select("*").order("created_at",{ascending:false}).limit(3000);if(error)throw error;S.reports=data.map(mapReport)}
async function fetchViol(){const {data,error}=await S.sb.from("violations").select("*").order("created_at",{ascending:false}).limit(3000);if(error)throw error;S.violations=data.map(mapViol)}
async function fetchInvites(){
  if(!canManage(S.me)){S.invites=[];return}
  const {data,error}=await S.sb.from("invites").select("code_key,name,perms,attempts,created_by,created_at,used_at").is("used_at",null).order("created_at",{ascending:false});
  if(!error)S.invites=data.map(r=>({codeKey:r.code_key,name:r.name,perms:r.perms||{},attempts:r.attempts,by:r.created_by,createdAt:ms(r.created_at)}));
}
const debounced={};
function refetch(name,fn){clearTimeout(debounced[name]);debounced[name]=setTimeout(async()=>{try{await fn();render()}catch(e){}},250)}
async function loadAll(){
  try{await fetchMembers();await Promise.all([fetchReports(),fetchViol(),fetchInvites()]);S.loadErr=""}
  catch(e){S.loadErr="تعذّر تحميل البيانات: "+(e.message||"خطأ غير معروف")}
  S.ready=true;render();
  if(!S.channel){
    S.channel=S.sb.channel("rasd-live")
      .on("postgres_changes",{event:"*",schema:"public",table:"members"},()=>refetch("m",async()=>{await fetchMembers();await fetchInvites()}))
      .on("postgres_changes",{event:"*",schema:"public",table:"reports"},()=>refetch("r",fetchReports))
      .on("postgres_changes",{event:"*",schema:"public",table:"violations"},()=>refetch("v",fetchViol))
      .subscribe();
  }
}
function clearData(){S.members={};S.reports=[];S.violations=[];S.me=null;S.uid=null;S.draft=null;S.view="home";
  if(S.channel){S.sb.removeChannel(S.channel);S.channel=null}}

/* ---------- boot ---------- */
(async()=>{
  if(!SUPABASE_URL||!SUPABASE_ANON_KEY||!window.supabase){S.loadErr=!window.supabase?"تعذّر تحميل مكتبة Supabase. تأكد من الاتصال بالإنترنت.":"config";S.ready=true;render();return}
  S.sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
  render();
  const {data:{session}}=await S.sb.auth.getSession();
  if(session){S.uid=session.user.id;await loadAll()}else{S.ready=true;render()}
  S.sb.auth.onAuthStateChange((ev,session)=>{
    if(ev==="SIGNED_OUT"){clearData();render()}
  });
})();

/* ---------- render ---------- */
function render(){
  const app=$("#app");
  const focusId=document.activeElement?.id;
  const keep={};app.querySelectorAll("#gateForm input[id],#gateForm select[id],#vform select[id],#vform textarea[id],#iform input[id]:not([type=checkbox]),#iform select[id]").forEach(el=>keep[el.id]=el.value);
  if(S.loadErr==="config")app.innerHTML=configHTML();
  else if(!S.uid){app.innerHTML=gateHTML();bindGate();}
  else if(!S.ready||!S.me||S.me.status!=="active"){app.innerHTML=waitHTML();bindWait();}
  else{app.innerHTML=shellHTML();bindShell();}
  for(const [id,v] of Object.entries(keep)){const el=document.getElementById(id);if(el&&v&&el.type!=="password")el.value=v}
  const it=$("#i-num");if(it)it.dispatchEvent(new Event("input"));
  const n=$("#g-num");if(n&&n.value)n.dispatchEvent(new Event("input"));
  if(focusId){const el=document.getElementById(focusId);if(el&&el.tagName!=="BUTTON")el.focus()}
}

      ${act?"":`<small style="color:var(--steel-dim);text-align:center">ما عندك حساب؟ اطلب كودك ومفتاح التفعيل من قيادة الفرقة، ثم اختر "تفعيل الكود".</small>`}

  </div></div>`;
}
function bindGate(){
  document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{S.gateTab=b.dataset.tab;render()});
  const upd=()=>{const t=$("#g-type").value,n=$("#g-num").value.replace(/\D/g,"");$("#g-num").value=n;
    $("#g-prev").textContent=n?`${codeLabel(t,n)} | ${ctype(t).title} | فرقة الرصد والمتابعة`:"اختر الكود وأدخل رقمك"};
  $("#g-type").onchange=upd;$("#g-num").oninput=upd;
  const gk=$("#g-key");if(gk)gk.oninput=()=>{let v=gk.value.toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,10);gk.value=v.length>5?v.slice(0,5)+"-"+v.slice(5):v};
  $("#gateForm").onsubmit=async e=>{
    e.preventDefault();const err=$("#g-err");err.textContent="";
    const t=$("#g-type").value,n=$("#g-num").value.trim(),pin=$("#g-pin").value.trim();
    if(!n){err.textContent="أدخل رقم الكود.";return}
    if(!/^\d{4,8}$/.test(pin)){err.textContent="الرقم السري يجب أن يكون من ٤ إلى ٨ أرقام.";return}
    const key=`${t}-${n}`,btn=$("#g-go");btn.disabled=true;S.authBusy=true;
    const fail=msg=>{err.textContent=msg;btn.disabled=false;S.authBusy=false};
    try{
      if(S.gateTab==="activate"){
        const k=$("#g-key").value.trim();
        if(k.replace(/-/g,"").length!==10){fail("مفتاح التفعيل من ١٠ خانات.");return}
        if(pin!==$("#g-pin2").value.trim()){fail("الرقمان السريان غير متطابقين.");return}
        const {data:res,error}=await S.sb.rpc("activate_code",{p_code_key:key,p_key:k,p_pin:pin});
        if(error){fail("تعذّر التفعيل: "+error.message);return}
        if(res==="locked"){fail("تم قفل مفتاح التفعيل بسبب محاولات خاطئة كثيرة. اطلب مفتاحاً جديداً من القيادة.");return}
        if(res==="bad_pin"){fail("الرقم السري يجب أن يكون من ٤ إلى ٨ أرقام.");return}
        if(res!=="ok"){fail("الكود أو مفتاح التفعيل غير صحيح، أو تم استخدام المفتاح من قبل.");return}
      }
      const {data,error}=await S.sb.auth.signInWithPassword({email:authEmail(key),password:authPass(pin,key)});
      if(error){fail(/invalid/i.test(error.message)?"الكود أو الرقم السري غير صحيح.":"تعذّر الدخول: "+error.message);return}
      S.uid=data.user.id;S.authBusy=false;S.ready=false;S.view="home";render();await loadAll();
      if(S.me&&S.me.status==="active")toast((S.gateTab==="activate"?"تم تفعيل حسابك، أهلاً ":"أهلاً ")+S.me.name);
      S.gateTab="login";
    }catch(ex){fail("تعذّر الاتصال، حاول مرة أخرى.")}
  };
}

  $("#logout").onclick=()=>S.sb.auth.signOut();

  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{S.view=b.dataset.go;render()});

/* ---------- helpers ---------- */
const dayMs=(str,end)=>{if(!str)return null;const [y,m,d]=str.split("-").map(Number);return end?new Date(y,m-1,d,23,59,59,999).getTime():new Date(y,m-1,d).getTime()};
const ymd=t=>{const d=new Date(t);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`};
const inRange=(t,from,to)=>{const a=dayMs(from),b=dayMs(to,true);return (a==null||t>=a)&&(b==null||t<=b)};
const warnCount=key=>S.violations.filter(v=>v.memberKey===key&&(v.level==="warn"||v.level==="final")).length;
function violRow(v,manage){
  const L=LEVELS[v.level]||LEVELS.note;
  return `<div class="viol" style="--c:${L.c}">
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;min-width:0">${manage?`<b>${esc(v.memberName)}</b><span class="mono" style="color:var(--steel-dim);font-size:12.5px">${esc(v.memberCode)}</span>`:""}<span class="lvl ${v.level}">${L.name}</span></div>
    ${manage?`<button class="btn btn-ghost btn-sm" data-delv="${v.id}">حذف</button>`:"<span></span>"}
    <p>${esc(v.reason)}</p>
    <small style="grid-column:1/-1">بواسطة ${esc(v.by||"القيادة")} · ${fmtDate(v.createdAt)}</small>
  </div>`;
}

function ctxOf(d){const L=S.members[d.leader];return {shift:d.shift,area:d.area,duration:d.duration,leader:L?`${L.name} | ${codeLabel(L.codeType,L.num)}`:"—"}}
function autoDetails(d){if(!d.dirty)d.details=rtype(d.type).tpl(ctxOf(d))}
function partNames(d){return [...d.participants.map(k=>S.members[k]).filter(Boolean).map(m=>`${m.name} | ${codeLabel(m.codeType,m.num)}`),...d.extra]}
function previewText(d){
  const t=rtype(d.type);
  let s=`بسم الله الرحمن الرحيم\n\nنموذج المباشرة الميدانية – الرصد والمتابعة\n\nرقم التقرير : ${myReports().length+1}\n\nنوع التقرير : ${t.name}\n\nمنطقة المباشرة : ${d.area||"—"}\n\nتفاصيل الحالة : ${d.details}`;
  const cs=t.cases?d.cases.filter(c=>c.trim()):[];
  if(cs.length)s+=`\n\nالحالات :\n${cs.map((c,i)=>`${i+1} - ${c}`).join("\n")}`;
  s+=`\n\nالأشخاص المشاركون : ${partNames(d).map(x=>"@"+x).join(" ")}\n\nمعد التقرير : @${S.me.name} | ${codeLabel(S.me.codeType,S.me.num)}\n\nصور الحالات الميدانية (${d.images.length})`;
  return esc(s).replace(/^(بسم الله الرحمن الرحيم|نموذج المباشرة.*)$/gm,'<span class="hd">$1</span>');
}

    if(!d.dirty){const ta=$("#n-details");if(ta&&document.activeElement!==ta)ta.value=d.details}},180)};
  $("#n-area").oninput=e=>{d.area=e.target.value;soft()};
  $("#n-leader").onchange=e=>{d.leader=e.target.value;re()};
  const dur=$("#n-dur");if(dur)dur.oninput=e=>{d.duration=e.target.value;soft()};
  $("#n-details").oninput=e=>{d.details=e.target.value;d.dirty=true;soft()};

  document.querySelectorAll("[data-case]").forEach(i=>i.oninput=e=>{d.cases[+i.dataset.case]=e.target.value;soft()});

  document.querySelectorAll("[data-rmimg]").forEach(b=>b.onclick=e=>{e.preventDefault();d.images.splice(+b.dataset.rmimg,1);render()});
  document.querySelectorAll("[data-zoom]").forEach(i=>i.onclick=e=>{e.preventDefault();lightbox(i.src)});

  drop.ondrop=e=>{e.preventDefault();drop.classList.remove("over");addFiles(e.dataTransfer.files)};

async function addFiles(files){
  const d=S.draft;const list=[...files].filter(f=>f.type.startsWith("image/"));
  if(!list.length)return;
  const room=6-d.images.length;if(room<=0){toast("الحد الأقصى ٦ صور");return}
  toast("جارِ تجهيز الصور…");
  for(const f of list.slice(0,room)){try{d.images.push(await compress(f))}catch(e){toast("تعذّر قراءة إحدى الصور")}}
  render();
}
function compress(file){
  return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const img=new Image();img.onerror=rej;img.onload=()=>{
    let max=1600,q=.82,out;
    for(let i=0;i<8;i++){const s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);out=c.toDataURL("image/jpeg",q);if(out.length<900000)break;max*=.85;q=Math.max(.55,q-.05)}
    res(out)};img.src=r.result};r.readAsDataURL(file)});
}
async function submitReport(){
  const d=S.draft,t=rtype(d.type),err=$("#n-err"),btn=$("#n-submit");err.textContent="";
  if(!d.area.trim()){err.textContent="أدخل منطقة المباشرة.";$("#n-area").focus();return}
  if(d.details.trim().length<15){err.textContent="اكتب تفاصيل الحالة بشكل أوضح.";return}
  if(t.cases&&!d.cases.some(c=>c.trim())){err.textContent="أضف حالة واحدة على الأقل.";return}
  if(d.images.length<t.minImg){err.textContent=`هذا النوع يتطلب ${t.minImg} صورة على الأقل.`;return}
  btn.disabled=true;btn.innerHTML='<span class="loader"></span> جارِ الرفع';
  const id=crypto.randomUUID(),paths=[];
  try{
    for(let i=0;i<d.images.length;i++){
      const blob=await (await fetch(d.images[i])).blob();
      const path=`${S.uid}/${id}/${i+1}.jpg`;
      const up=await S.sb.storage.from("report-images").upload(path,blob,{contentType:"image/jpeg",upsert:false});
      if(up.error)throw up.error;paths.push(path);
    }
    const {data,error}=await S.sb.from("reports").insert({id,type:d.type,shift:d.shift,area:d.area.trim(),leader:d.leader||null,
      details:d.details.trim(),cases:t.cases?d.cases.map(c=>c.trim()).filter(Boolean):[],participants:partNames(d),images:paths}).select().single();
    if(error)throw error;
    S.reports=[mapReport(data),...S.reports.filter(r=>r.id!==data.id)];
    S.draft=null;S.view="home";render();toast(`تم رفع التقرير رقم ${data.num} بنجاح`);
  }catch(e){
    if(paths.length)S.sb.storage.from("report-images").remove(paths);
    btn.disabled=false;btn.textContent="رفع التقرير للمسؤول";err.textContent="تعذّر رفع التقرير: "+(e.message||"حاول مرة أخرى.");
  }
}

/* ---------- inventory ---------- */
function invPreset(id){
  const now=new Date(),today=ymd(now);
  if(id==="today")return {from:today,to:today};
  if(id==="week")return {from:ymd(now.getTime()-6*864e5),to:today};
  if(id==="month")return {from:ymd(new Date(now.getFullYear(),now.getMonth(),1)),to:today};
  if(id==="last")return {from:ymd(new Date(now.getFullYear(),now.getMonth()-1,1)),to:ymd(new Date(now.getFullYear(),now.getMonth(),0))};
  return {from:"",to:""};
}

      <div class="card" id="i-result" style="align-content:start">${x?`<h3>${x.reset?"مفتاح إعادة تعيين":"تم إصدار الكود"}</h3>
        <div class="kv"><div><small>الفرد</small><b>${esc(x.name)}</b></div><div><small>الكود</small><b class="mono">${esc(x.label)}</b></div></div>
        <div class="preview-code" style="font-size:26px;letter-spacing:4px;direction:ltr;padding:16px;color:#fff">${esc(x.key)}</div>
        <small style="color:var(--warn)">المفتاح يظهر هنا مرة واحدة فقط. أرسله للفرد بالخاص في دسكورد، لا في روم عام.</small>
        <div class="paper" style="max-height:none" id="i-msg">${esc(issuedMessage(x))}</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-primary btn-sm" id="i-copy">نسخ الرسالة</button><button class="btn btn-ghost btn-sm" id="i-copykey">نسخ المفتاح فقط</button><button class="btn btn-ghost btn-sm" id="i-clear">إخفاء</button></div>`
      :`<div class="empty" style="border:0;padding:24px 8px"><b>المفتاح يظهر هنا</b>بعد الإصدار تنسخ رسالة جاهزة فيها الكود ومفتاح التفعيل ورابط الموقع وترسلها للفرد.</div>`}</div>
    </div>
    ${S.invites.length?`<div class="section-h"><div><h2>أكواد لم تُفعّل بعد</h2><p>${S.invites.length} كود بانتظار أن يفعّله صاحبه</p></div></div>
    <div class="list">${S.invites.map(v=>{const m=Object.values(S.members).find(z=>z.codeKey===v.codeKey);const [ct,n]=v.codeKey.split("-");
      return `<div class="rep" style="cursor:default"><div class="no" style="font-size:12px">${v.attempts>=8?'<span style="color:var(--bad)">مقفل</span>':m?"تعيين":"جديد"}</div>
      <div class="meta"><b>${esc(v.name)} · <span class="mono">${esc(codeLabel(ct,n))}</span></b><small>أصدره ${esc(v.by||"التأسيس")} · ${fmtDate(v.createdAt)}${v.attempts?` · ${v.attempts} محاولة خاطئة`:""}</small></div>
      <div style="display:flex;gap:8px"><button class="btn btn-ghost btn-sm" data-reissue="${v.codeKey}">مفتاح جديد</button><button class="btn btn-ghost btn-sm" data-uninvite="${v.codeKey}">إلغاء</button></div></div>`}).join("")}</div>`:""}
    ${pending.length?`<div class="section-h"><div><h2>طلبات قديمة بانتظار الموافقة</h2><p>حسابات سُجّلت قبل إغلاق التسجيل المفتوح</p></div></div>
    <div class="list">${pending.map(m=>`<div class="rep" style="cursor:default"><div class="no" style="font-size:13px">قديم</div>
      <div class="meta"><b>${esc(m.name)}</b><small>${esc(fullCode(m))} · ${fmtDate(m.createdAt)}</small></div>
      <div style="display:flex;gap:8px"><button class="btn btn-ok btn-sm" data-approve="${m.key}">قبول</button><button class="btn btn-bad btn-sm" data-reject="${m.key}">رفض</button></div></div>`).join("")}</div>`:""}
    <div class="section-h"><div><h2>الأفراد المفعّلون</h2><p>${rows.length} فرد · مرتّبون حسب التقارير المقبولة</p></div></div>
    <div class="table-wrap"><table style="min-width:900px"><thead><tr><th>الاسم</th><th>الكود</th><th>المقبولة</th><th>الانتظار</th><th>المرفوضة</th><th>الإجمالي</th><th></th><th>الصلاحيات</th><th>الحساب</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td>${esc(r.m.name)}</td><td class="num" style="white-space:nowrap">${esc(codeLabel(r.m.codeType,r.m.num))}</td><td class="num" style="color:var(--ok)">${r.a}</td><td class="num" style="color:var(--warn)">${r.p}</td><td class="num" style="color:var(--bad)">${r.x}</td><td class="num">${r.t}</td><td><div class="bar"><i style="width:${r.a/top*100}%"></i></div></td>
      <td><div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">${PERMS.filter(p=>hasPerm(r.m,p.id)).map(p=>`<span class="chip accepted" style="font-weight:600">${p.name}</span>`).join("")||'<span style="color:var(--steel-dim);font-size:12.5px">فرد</span>'}
      <button class="btn btn-ghost btn-sm" data-perm="${r.m.key}">تعديل</button></div></td>
      <td><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn btn-ghost btn-sm" data-reset="${r.m.codeKey}">رقم سري جديد</button>${r.m.key===S.me.key?"":`<button class="btn btn-ghost btn-sm" data-suspend="${r.m.key}">إيقاف</button>`}</div></td></tr>`).join("")||`<tr><td colspan="9">لا يوجد أفراد بعد</td></tr>`}
    </tbody></table></div>
    ${stopped.length?`<details class="card"><summary style="cursor:pointer;color:var(--steel)">الحسابات الموقوفة (${stopped.length})</summary>
      <div class="list">${stopped.map(m=>`<div class="rep" style="cursor:default"><div class="no" style="font-size:12px">موقوف</div><div class="meta"><b>${esc(m.name)}</b><small>${esc(fullCode(m))}${m.approvedBy?" · بواسطة "+esc(m.approvedBy):""}</small></div><button class="btn btn-ghost btn-sm" data-approve="${m.key}">إعادة التفعيل</button></div>`).join("")}</div></details>`:""}
  </section>`;
}
function bindMembers(){
  const upd=()=>{const t=$("#i-type").value,n=$("#i-num").value.replace(/\D/g,"");$("#i-num").value=n;
    const key=`${t}-${n}`,m=n&&Object.values(S.members).find(z=>z.codeKey===key);
    $("#i-prev").innerHTML=!n?"اختر الكود وأدخل الرقم":m?`<span style="color:var(--warn)">الكود ${esc(codeLabel(t,n))} مستخدم من ${esc(m.name)}. الإصدار سيعطيه مفتاحاً جديداً لتغيير رقمه السري.</span>`:esc(`${codeLabel(t,n)} | ${ctype(t).title} | فرقة الرصد والمتابعة`);
    $("#i-name").disabled=!!m;$("#i-permbox").style.opacity=m?.4:1;if(m)$("#i-name").value=m.name};
  $("#i-type").onchange=upd;$("#i-num").oninput=upd;
  PERMS.forEach(p=>{const c=$("#ip-"+p.id);c.onchange=()=>S.iperms[p.id]=c.checked});
  $("#iform").onsubmit=async e=>{
    e.preventDefault();const err=$("#i-err");err.textContent="";
    const t=$("#i-type").value,n=$("#i-num").value.trim(),name=$("#i-name").value.trim(),key=`${t}-${n}`;
    if(!n){err.textContent="أدخل رقم الكود.";return}
    const exists=Object.values(S.members).find(z=>z.codeKey===key);
    if(!exists&&name.length<2){err.textContent="أدخل اسم الفرد.";return}
    const btn=$("#i-go");btn.disabled=true;
    await doIssue(key,exists?exists.name:name,{...S.iperms},err);
    btn.disabled=false;
  };
  const cp=(txt,ok)=>{try{navigator.clipboard.writeText(txt).then(()=>toast(ok),()=>toast("حدّد النص وانسخه يدوياً"))}catch(e){toast("حدّد النص وانسخه يدوياً")}};
  const c1=$("#i-copy");if(c1)c1.onclick=()=>cp(issuedMessage(S.issued),"تم نسخ الرسالة");
  const c2=$("#i-copykey");if(c2)c2.onclick=()=>cp(S.issued.key,"تم نسخ المفتاح");
  const c3=$("#i-clear");if(c3)c3.onclick=()=>{S.issued=null;render()};
  document.querySelectorAll("[data-reissue]").forEach(b=>b.onclick=()=>{const v=S.invites.find(z=>z.codeKey===b.dataset.reissue);if(v){b.disabled=true;doIssue(v.codeKey,v.name,v.perms).finally(()=>b.disabled=false)}});
  document.querySelectorAll("[data-reset]").forEach(b=>b.onclick=()=>{const m=Object.values(S.members).find(z=>z.codeKey===b.dataset.reset);if(m){b.disabled=true;doIssue(m.codeKey,m.name,{}).finally(()=>b.disabled=false)}});
  document.querySelectorAll("[data-uninvite]").forEach(b=>b.onclick=async()=>{
    if(b.dataset.sure!=="1"){b.dataset.sure="1";b.textContent="تأكيد الإلغاء";return}
    b.disabled=true;const {error}=await S.sb.from("invites").delete().eq("code_key",b.dataset.uninvite);
    if(error){b.disabled=false;toast("تعذّر الإلغاء");return}
    await fetchInvites();render();toast("تم إلغاء الكود")});
  document.querySelectorAll("[data-suspend]").forEach(b=>b.onclick=()=>{
    if(b.dataset.sure!=="1"){b.dataset.sure="1";b.textContent="تأكيد الإيقاف";return}
    setMemberStatus(b.dataset.suspend,"suspended",b)});
}
async function doIssue(key,name,perms,errEl){
  const {data,error}=await S.sb.rpc("issue_code",{p_code_key:key,p_name:name,p_perms:perms});
  if(error){const msg=/not_allowed/.test(error.message)?"لا تملك صلاحية إصدار الأكواد.":"تعذّر الإصدار: "+error.message;if(errEl)errEl.textContent=msg;else toast(msg);return}
  const [t,n]=key.split("-");const reset=!!Object.values(S.members).find(z=>z.codeKey===key);
  S.issued={key:data,label:codeLabel(t,n),name,reset};
  const f=$("#iform");if(f)f.reset();
  await fetchInvites();render();window.scrollTo({top:0,behavior:"smooth"});toast(reset?"تم إصدار مفتاح إعادة التعيين":"تم إصدار الكود");
}
async function setMemberStatus(key,status,btn){
  btn.disabled=true;const {error}=await S.sb.from("members").update({status}).eq("id",key);
  if(error){btn.disabled=false;toast("تعذّر الحفظ: "+error.message);return}
  await fetchMembers();render();toast(status==="active"?"تم تفعيل الحساب":status==="suspended"?"تم إيقاف الحساب":"تم رفض الطلب");
}
function openPerms(key){
  const m0=S.members[key];if(!m0)return;const self=key===S.me.key;
  const m=document.createElement("div");m.className="modal";
  m.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" style="max-width:480px">
    <div><h2 style="font-size:20px">صلاحيات ${esc(m0.name)}</h2><small style="color:var(--steel-dim)">${esc(fullCode(m0))}</small></div>
    ${PERMS.map(p=>{const lock=self&&p.id==="manage";return `<label class="toggle"><div><b>${p.name}</b><small>${lock?"لا يمكنك سحب هذه الصلاحية من نفسك":p.hint}</small></div>
      <span class="sw"><input type="checkbox" id="perm-${p.id}" ${hasPerm(m0,p.id)?"checked":""} ${lock?"disabled":""}><i></i></span></label>`}).join("")}
    ${m0.permBy?`<small style="color:var(--steel-dim)">آخر تعديل: ${esc(m0.permBy)} · ${fmtDate(m0.permAt)}</small>`:""}
    <div class="err" id="p-err"></div>
    <div style="display:flex;gap:10px"><button class="btn btn-primary" id="p-save">حفظ الصلاحيات</button><button class="btn btn-ghost" id="p-close">إلغاء</button></div>
  </div>`;
  document.body.appendChild(m);
  const close=()=>m.remove();m.onclick=e=>{if(e.target===m)close()};$("#p-close",m).onclick=close;
  $("#p-save",m).onclick=async()=>{
    const perms={};PERMS.forEach(p=>perms[p.id]=$("#perm-"+p.id,m).checked);
    const btn=$("#p-save",m);btn.disabled=true;
    const {error}=await S.sb.from("members").update({perms}).eq("id",key);
    if(error){btn.disabled=false;$("#p-err",m).textContent="تعذّر الحفظ: "+error.message;return}
    await fetchMembers();render();close();toast("تم حفظ صلاحيات "+m0.name);
  };
}

/* ---------- report modal ---------- */
async function openReport(id){
  const r=S.reports.find(x=>x.id===id);if(!r)return;
  const t=rtype(r.type),rev=isReviewer(S.me),own=r.ownerKey===S.me.key;
  const m=document.createElement("div");m.className="modal";
  m.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">
    <div class="sheet-h"><div><h2 style="font-size:20px">تقرير رقم <span class="mono">${r.num}</span> · ${esc(t.name)}</h2>
      <small style="color:var(--steel-dim)">${esc(r.ownerName)} · ${esc(r.ownerCode)} · ${fmtDate(r.createdAt)}</small></div>
      <span class="chip ${r.status}">${STATUS[r.status]}</span></div>
    <div class="kv"><div><small>منطقة المباشرة</small><b>${esc(r.area)}</b></div><div><small>الفترة</small><b>${esc(r.shift||"—")}</b></div><div><small>قائد المباشرة</small><b>${esc(r.leaderName||"—")}</b></div><div><small>عدد الصور</small><b class="mono">${r.imageCount}</b></div></div>
    <div class="field"><span>تفاصيل الحالة</span><div class="paper" style="max-height:none">${esc(r.details)}${r.cases?.length?"\n\nالحالات:\n"+r.cases.map((c,i)=>`${i+1} - ${esc(c)}`).join("\n"):""}</div></div>
    <div class="field"><span>الأشخاص المشاركون</span><div class="pills">${(r.participants||[]).map(p=>`<span class="pill">${esc(p.replace(/^@/,""))}</span>`).join("")||"—"}</div></div>
    <div class="field"><span>صور الحالات الميدانية</span><div class="thumbs" id="m-imgs">${r.images.map(()=>`<div class="thumb"><span class="loader" style="margin:auto;position:absolute;inset:0"></span></div>`).join("")||'<small style="color:var(--steel-dim)">لا توجد صور</small>'}</div></div>
    ${r.status!=="pending"?`<div class="kv"><div><small>المراجع</small><b>${esc(r.reviewer||"—")}</b></div><div><small>وقت المراجعة</small><b>${fmtDate(r.reviewedAt)}</b></div></div>`:""}
    ${r.status==="rejected"&&r.note?`<div class="rep" style="cursor:default"><div class="note" style="grid-column:1/-1"><b>سبب الرفض:</b> ${esc(r.note)}</div></div>`:""}
    ${rev?`<div class="decide"><label class="field"><span>ملاحظة المسؤول ${r.status!=="accepted"?"(مطلوبة عند الرفض)":""}</span><textarea id="m-note" style="min-height:80px" placeholder="مثال: الصور غير واضحة، أعد الرفع">${esc(r.note||"")}</textarea></label>
      <div class="err" id="m-err"></div>
      <div class="row"><button class="btn btn-ok" id="m-acc">قبول التقرير</button><button class="btn btn-bad" id="m-rej">رفض التقرير</button><span style="flex:1"></span>${own&&r.status==="pending"?'<button class="btn btn-ghost" id="m-del">حذف</button>':""}<button class="btn btn-ghost" id="m-close">إغلاق</button></div></div>`
    :`<div class="row" style="display:flex;gap:10px;flex-wrap:wrap">${own&&r.status==="pending"?'<button class="btn btn-bad btn-sm" id="m-del">حذف التقرير</button>':""}<span style="flex:1"></span><button class="btn btn-ghost" id="m-close">إغلاق</button></div>`}
  </div>`;
  document.body.appendChild(m);document.body.style.overflow="hidden";
  const onKey=e=>{if(e.key==="Escape")close()};
  const close=()=>{m.remove();document.body.style.overflow="";document.removeEventListener("keydown",onKey)};
  document.addEventListener("keydown",onKey);
  m.onclick=e=>{if(e.target===m)close()};$("#m-close",m).onclick=close;
  const decide=async st=>{
    const note=$("#m-note",m).value.trim(),err=$("#m-err",m);
    if(st==="rejected"&&!note){err.textContent="اكتب سبب الرفض ليعرفه صاحب التقرير.";return}
    m.querySelectorAll(".decide .btn").forEach(b=>b.disabled=true);
    const {data,error}=await S.sb.from("reports").update({status:st,note}).eq("id",r.id).select().single();
    if(error){err.textContent="تعذّر الحفظ: "+error.message;m.querySelectorAll(".decide .btn").forEach(b=>b.disabled=false);return}
    S.reports=S.reports.map(x=>x.id===data.id?mapReport(data):x);render();close();toast(st==="accepted"?"تم قبول التقرير":"تم رفض التقرير");
  };
  if(rev){$("#m-acc",m).onclick=()=>decide("accepted");$("#m-rej",m).onclick=()=>decide("rejected")}
  const del=$("#m-del",m);if(del)del.onclick=async()=>{
    if(del.dataset.sure!=="1"){del.dataset.sure="1";del.textContent="اضغط مرة ثانية للتأكيد";return}
    del.disabled=true;
    const {error}=await S.sb.from("reports").delete().eq("id",r.id);
    if(error){del.disabled=false;toast("تعذّر الحذف");return}
    if(r.images.length)await S.sb.storage.from("report-images").remove(r.images);
    S.reports=S.reports.filter(x=>x.id!==r.id);render();close();toast("تم حذف التقرير");
  };
  if(r.images.length){
    const box=$("#m-imgs",m);
    const {data,error}=await S.sb.storage.from("report-images").createSignedUrls(r.images,3600);
    r.images.forEach((p,i)=>{const cell=box.children[i];if(!cell)return;const u=!error&&data[i]&&data[i].signedUrl;
      cell.innerHTML=u?`<img src="${u}" alt="صورة ${i+1}" loading="lazy">`:'<small style="padding:8px;display:block;color:var(--steel-dim)">غير متاحة</small>';
      const im=cell.querySelector("img");if(im)im.onclick=()=>lightbox(im.src)});
  }
}
function lightbox(src){const l=document.createElement("div");l.className="lightbox";l.innerHTML=`<img src="${src}" alt="">`;l.onclick=()=>l.remove();document.body.appendChild(l)}

</script>
</body>
</html>
